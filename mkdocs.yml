site_name: Cyber Coyotes Programmer's Handbook
site_description: FRC 3603 Cyber Coyotes Programming Resources
site_author: FRC 3603 Cyber Coyotes
repo_url: https://github.com/CyberCoyotes/Programmers-Handbook
repo_name: CyberCoyotes/Programmers-Handbook
  
docs_dir: docs/source

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Learn Java:
    - Level 1: guide-to-java-level-1.md
    - Level 2: guide-to-java-level-2.md
    - Level 3: guide-to-java-level-3.md
    - Level 4: guide-to-java-level-4.md
    - Level 5: guide-to-java-level-5.md
    - Level 6: guide-to-java-level-6.md

plugins:
  - search

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true